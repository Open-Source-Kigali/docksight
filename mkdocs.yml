site_name: DockSight
site_description: >-
  Open-source Docker management and observability platform. Manage many remote
  Docker hosts from one dashboard, with agents that never expose an inbound port.
site_author: DockSight contributors
site_url: https://Open-Source-Kigali.github.io/docksight/

repo_name: Open-Source-Kigali/docksight
repo_url: https://github.com/Open-Source-Kigali/docksight
edit_uri: edit/develop/docs/

copyright: Copyright &copy; DockSight contributors

theme:
  name: material
  language: en

  icon:
    repo: fontawesome/brands/github
    logo: material/docker

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang: en

markdown_extensions:
  # Callouts: !!! note, !!! warning, ??? tip
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  # Mermaid diagrams render from ```mermaid fences.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started:
      - Introduction: introduction.md
      - Architecture: architecture.md
      - Installation: installation.md
  - Components:
      - Platform: platform.md
      - Agent: agent.md
      - CLI reference: cli.md
      - WebSocket protocol: websocket-protocol.md
      - Protocol specification: protocol.md
      - HTTP API: api/README.md
  - Operations:
      - Security: security.md
      - Release process: release-process.md
      - FAQ: faq.md
  - Project:
      - Development: development.md
      - Contributing: contributing.md
      - Roadmap: roadmap.md
      - Decision records:
          - ADR 001 — Stack selection: decisions/001-stack-selection.md
          - ADR 002 — Database selection: decisions/002-database-selection.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Open-Source-Kigali/docksight
      name: DockSight on GitHub

  generator: false

extra_css:
  - stylesheets/extra.css
